# GitHub Actions workflow: release via python-semantic-release, publish to PyPI on stable releases

name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Release
        id: release
        run: |
          BEFORE=$(git tag -l | sort)
          uv run semantic-release version
          AFTER=$(git tag -l | sort)
          NEW_TAG=$(comm -13 <(echo "$BEFORE") <(echo "$AFTER") | head -1)
          if [ -n "$NEW_TAG" ]; then
            echo "released=true" >> $GITHUB_OUTPUT
            echo "version=${NEW_TAG#v}" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish to PyPI
        if: steps.release.outputs.released == 'true' && !contains(steps.release.outputs.version, '-rc.')
        run: |
          uv build
          uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
