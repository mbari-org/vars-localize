[project]
name = "vars-localize"
version = "0.6.0-rc.2"
description = "Tool for creating localization with VARS."
authors = [
    { name = "Kevin Barnard", email = "kbarnard@mbari.org" }
]
dependencies = [
    "pyqt6>=6.7.1",
    "requests>=2.32.3",
    "qdarkstyle>=3.2.3",
    "loguru>=0.7.2",
]
readme = "README.md"
requires-python = ">= 3.10"
keywords = ["VARS", "localization", "annotation"]

[project.scripts]
vars-localize = "vars_localize.__main__:main"

[project.optional-dependencies]
sam = [
    "ultralytics>=8.4.26",
    "timm"
]



[dependency-groups]
dev = [
    "python-semantic-release>=9.15.1",
    "pre-commit>=4.0.1",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.39",
    "pymdown-extensions>=10.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/vars_localize"]

[tool.semantic_release]
assets = []
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
logging_use_named_masks = false
major_on_zero = true
allow_zero_version = true
tag_format = "v{version}"
version_toml = [
    "pyproject.toml:project.version",
]
version_variables = [
    "src/vars_localize/__init__.py:__version__",
]

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.branches.develop]
match = "develop"
prerelease_token = "rc"
prerelease = true

[tool.semantic_release.changelog]
template_dir = "templates"
exclude_commit_patterns = []

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = true

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true